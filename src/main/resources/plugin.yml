name: CavesLite
version: '${version}'
main: dev.caveslite.CavesLite
api-version: '26.1'
description: Lightweight vanilla-style anomalies, encounters, cave ambience and custom creatures for modern Minecraft.
author: Italo
softdepend: [Vault, PlaceholderAPI]
commands:
  clite:
    aliases: [caveslite]
    description: Manage CavesLite encounters and options
    usage: /<command> [list|summon|herobrine|kill|kills|options|debug|reload]
    permission: caveslite.command
permissions:
  caveslite.command:
    description: Use CavesLite administration commands
    default: op
