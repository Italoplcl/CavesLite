# CavesLite 1.12.2 - apariencia de los paneles administrativos
# Puedes cambiar textos, colores, simbolos, columnas y materiales sin recompilar.
# Los colores usan el formato legacy de Minecraft (&a, &c, &l, etc.).
main:
  title: "@lang:dialogs.main.title"
  description: "@lang:dialogs.main.description"
  columns: 3
  active-prefix: "@lang:dialogs.main.active-prefix"
  inactive-prefix: "@lang:dialogs.main.inactive-prefix"
  decorative-item: SCULK_CATALYST
  herobrine-label: "@lang:dialogs.main.herobrine-label"

mob:
  title-prefix: "@lang:dialogs.mob.title-prefix"
  description: "@lang:dialogs.mob.description"
  icon-width: 48
  icon-height: 48
  buttons:
    save: "@lang:dialogs.mob.buttons.save"
    summon: "@lang:dialogs.mob.buttons.summon"
    remove: "@lang:dialogs.mob.buttons.remove"
  labels:
    enabled: "@lang:dialogs.mob.labels.enabled"
    name: "@lang:dialogs.mob.labels.name"
    show-name: "@lang:dialogs.mob.labels.show-name"
    priority: "@lang:dialogs.mob.labels.priority"
    bossbar: "@lang:dialogs.mob.labels.bossbar"
    ymin: "@lang:dialogs.mob.labels.ymin"
    ymax: "@lang:dialogs.mob.labels.ymax"
    cooldown: "@lang:dialogs.mob.labels.cooldown"
    maxactive: "@lang:dialogs.mob.labels.maxactive"

icons:
  alpha-spider: SPIDER_EYE
  cave-golem: IRON_PICKAXE
  crying-bat: BAT_SPAWN_EGG
  dead-miner: PLAYER_HEAD
  hexed-armor: IRON_CHESTPLATE
  hungering-darkness: BLACK_DYE
  lava-creeper: LAVA_BUCKET
  magma-monster: MAGMA_BLOCK
  mimic: CHEST
  smoke-demon: CAMPFIRE
  tnt-creeper: TNT
  watcher: ENDER_EYE
  giant-zombie: ZOMBIE_HEAD
  chicken-jockey: CHICKEN_SPAWN_EGG
  killer-bunny: RABBIT_FOOT
  illusioner: BOW
  spider-jockey: SKELETON_SKULL
  skeleton-horseman: SKELETON_HORSE_SPAWN_EGG
  herobrine: PLAYER_HEAD

# Panel global: /clite options
# Solo contiene sistemas que existen realmente en el plugin.
options:
  title: "@lang:dialogs.options.title"
  description: "@lang:dialogs.options.description"
  saved: "@lang:dialogs.options.saved"
  labels:
    ambient: "@lang:dialogs.options.labels.ambient"
    footsteps: "@lang:dialogs.options.labels.footsteps"
    tension: "@lang:dialogs.options.labels.tension"
    bossbar: "@lang:dialogs.options.labels.bossbar"
    spawn-titles: "@lang:dialogs.options.labels.spawn-titles"
    warnings: "@lang:dialogs.options.labels.warnings"
    trails: "@lang:dialogs.options.labels.trails"
    achievements: "@lang:dialogs.options.labels.achievements"
    leaderboards: "@lang:dialogs.options.labels.leaderboards"
  buttons:
    save: "@lang:dialogs.options.buttons.save"
