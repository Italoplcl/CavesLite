      - BOOK
      - SADDLE
      - OAK_PLANKS
      - TORCH
      - COAL
      - GOLDEN_APPLE
      - COBWEB

  # Cave Golem
  # Has strong attack, can be damaged only with pickaxe, drops its head on death
  cave-golem:
    enabled: false
    priority: 0
    name: "&4Cave Golem"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 35
    # Give Cave Golem slowness effect
