# CavesLite 1.12.0 - configuracion principal.
# Todas las criaturas y encuentros especiales vienen desactivados por defecto.
# Activalos explicitamente desde /clite o editando este archivo.

# Idioma de todos los mensajes del plugin (comandos, Herobrine, etc.).
# Corresponde a un archivo en la carpeta lang/ (es.yml y en.yml vienen
# incluidos; puedes agregar los que quieras y usar su mismo nombre aquí).
language: es

caverns:
  # Ambient Sounds - special sound may be played underground
  ambient:
    enabled: true
    # List of worlds where ambient sounds can be played
    worlds:
      - world
    # Chance of sound will be played
    # Checking every PLAYER tick
    chance: 6.35
    # Maximal Y where sound can be played
    y-max: 64
    # Play sound in random location near player. 0 to play sound on player's location
    near: 7
    # Everyone will hear a sound in its radius
    server-wise: true
    # Minimal distance between sound sources if server-wise option is used.
    # May affect performance when enabled. Set to 0 or lower to disable
    server-wise-distance: 0
    # List of sounds to play - you can add more or remove some.
    # "weight" controls how often each one gets picked relative to the
    # others (default 10). Give the scariest ones a lower weight so they
    # stay rare and hit harder.
    sounds:
      MUSIC_DISC_11:
        volume: 1
        pitch: 0.5
        weight: 10
      ENCHANT_THORNS_HIT:
        volume: 0.04
        pitch: 0.2
        weight: 10
      ENTITY_GHAST_SCREAM:
        volume: 1
        pitch: 0.5
        weight: 8
      MUSIC_DISC_13:
        volume: 1
        pitch: 1
        weight: 10
      AMBIENT_CAVE:
        volume: 1
        pitch: 0.8
        weight: 10
      BLOCK_SCULK_SHRIEKER_SHRIEK:
        volume: 0.6
        pitch: 0.6
        weight: 4
      ENTITY_WARDEN_NEARBY_CLOSE:
        volume: 0.5
        pitch: 1
        weight: 2
      ENTITY_ENDERMAN_STARE:
        volume: 0.7
        pitch: 0.7
        weight: 6
      ENTITY_WITHER_AMBIENT:
        volume: 0.3
        pitch: 0.4
        weight: 3

    # The deeper a player is, the more often ambient sounds play and the
    # lower-pitched (spookier) they sound. Set enabled: false to go back to
    # a flat chance everywhere.
    depth-scaling:
      enabled: true
      # At or below this Y, the effect is at its strongest.
      y-full: -32
      # At or above this Y (but still a cave), the effect does nothing.
      y-none: 60
      # "chance" above is multiplied by up to this much at y-full.
      max-chance-multiplier: 3.0
      # How much is subtracted from a sound's pitch at y-full.
      pitch-drop: 0.3

    # Ghost footsteps: a step sound plays a few blocks behind a lone player
    # underground. No mob is actually there.
    footsteps:
      enabled: true
      worlds:
        - world
      # Chance checked every 3 seconds (60 ticks)
      chance: 8
      y-max: 40
      # Only plays when the player has no one else within 20 blocks
      require-alone: true
      distance: 4
      behind-only: true
      sound: minecraft:block.stone.step
      volume: 0.6
      pitch: 0.75

# Heartbeat that speeds up when a scary custom mob is nearby.
tension:
  enabled: true
  # Which custom mobs (by id) trigger the heartbeat
  mobs:
    - watcher
    - hungering-darkness
    - smoke-demon
  # How far away (in blocks) a watched mob starts the heartbeat
  radius: 16
  # Beat interval, in ticks, when the mob is at the edge of "radius" / right on top of the player
  max-interval-ticks: 60
  min-interval-ticks: 10
  sound: minecraft:block.sculk_sensor.clicking
  volume: 1
  pitch: 1

# Shows a boss bar naming whichever enabled mob is closest to each player.
boss-bar:
  enabled: false
  worlds:
    - world
  # How far away (in blocks) a mob has to be to show up in the bar
  radius: 24
  # {mob} is replaced by the mob's name (its id, with dashes turned into spaces)
  format: "&4{mob} &7cerca..."
  # "distance" -> bar fills up the closer the mob gets.
  # "health" -> bar shows the mob's remaining health instead.
  progress: distance
  # RED, BLUE, GREEN, PINK, PURPLE, WHITE, YELLOW
  color: RED
  # PROGRESS (solid bar), or NOTCHED_6 / NOTCHED_10 / NOTCHED_12 / NOTCHED_20 (segmented)
  style: PROGRESS
  # Which mobs show up in the bar. false = never shown for that mob.
  mobs:
    alpha-spider: false
    cave-golem: false
    crying-bat: false
    dead-miner: false
    hexed-armor: false
    hungering-darkness: false
    lava-creeper: false
    magma-monster: false
    mimic: false
    smoke-demon: false
    tnt-creeper: false
    watcher: false
    giant-zombie: false
    chicken-jockey: false
    killer-bunny: false
    illusioner: false
    spider-jockey: false
    skeleton-horseman: false

# Dramatic title/subtitle flash to nearby players when an enabled mob spawns.
spawn-titles:
  enabled: true
  radius: 20
  # How far apart (in ticks) a single player can be shown a title again, so a
  # burst of spawns doesn't spam their screen.
  cooldown-ticks: 100
  fade-in-ticks: 10
  stay-ticks: 40
  fade-out-ticks: 10
  title: "&4\u00a1Cuidado!"
  # {mob} is replaced by the mob's name (its id, with dashes turned into spaces)
  subtitle: "&7{mob} ha aparecido cerca"
  mobs:
    alpha-spider: true
    cave-golem: true
    crying-bat: false
    dead-miner: true
    hexed-armor: true
    hungering-darkness: true
    lava-creeper: true
    magma-monster: true
    mimic: true
    smoke-demon: true
    tnt-creeper: true
    watcher: true

# Short Action Bar message shown while an enabled mob is close to a player.
warnings:
  enabled: true
  radius: 10
  message: "&7Sientes que algo te observa..."
  mobs:
    alpha-spider: false
    cave-golem: false
    crying-bat: false
    dead-miner: false
    hexed-armor: true
    hungering-darkness: true
    lava-creeper: false
    magma-monster: false
    mimic: true
    smoke-demon: true
    tnt-creeper: false
    watcher: true

# Faint particle trail left behind specific mobs. Disabled per-mob by default;
# turn on the ones you want.
trails:
  enabled: true
  # How far from a player a mob still gets its trail rendered
  radius: 32
  mobs:
    watcher:
      enabled: true
      particle: SOUL
      count: 2
      offset: 0.25
    smoke-demon:
      enabled: true
      particle: SMOKE
      count: 2
      offset: 0.3
    hungering-darkness:
      enabled: false
      particle: SQUID_INK
      count: 1
      offset: 0.2

# Plugin-side "achievements": counts kills of ANY enabled custom mob per
# player and celebrates when a threshold is reached. This is NOT a vanilla
# Minecraft advancement (no toast in the Advancements menu, no F key entry) -
# that would require a datapack shipped alongside the plugin.
achievements:
  enabled: true
  broadcast: true
  sound: minecraft:ui.toast.challenge_complete
  # Money rewards, paid through Vault - works with whatever economy plugin
  # is behind it (CMI, EssentialsX, or anything else Vault-compatible).
  # If Vault (or an economy plugin) isn't installed, this is silently skipped.
  economy:
    enabled: true
    # Paid on every custom mob kill, on top of any threshold reward below
    per-kill: 3
  # kills: label shown in the title/chat, plus its own money reward (0 = none)
  thresholds:
    5:
      label: "&6Cazador Novato"
      reward: 25
    15:
      label: "&6Cazador de las Profundidades"
      reward: 75
    30:
      label: "&4Terror de las Cuevas"
      reward: 150
    50:
      label: "&4Leyenda de las Cavernas"
      reward: 300

# "Who's killed the most custom mobs" leaderboards, for PlaceholderAPI
# (%caveslite_top_kills_1_name%, etc. - see CavesPlaceholders.java for
# the full list). A kill always updates the count immediately, but the
# sorted ranking and its own save file (leaderboards.yml) only refresh
# periodically - see "update-interval-ticks" - so this never saves to disk
# on every single kill.
leaderboards:
  enabled: true
  update-interval-ticks: 100
  # How many ranks are kept/available. Placeholders past this return empty.
  top-size: 10
  # Leaderboard combining kills of every custom mob together
  total: true
  # Per-mob leaderboards: off by default. Each one you enable here means the
  # plugin tracks (and stores) that mob's kills separately per player - if
  # you only care about the ranking for one or two mobs, only turn those on;
  # leaving the rest off keeps this feature lighter.
  mobs:
    alpha-spider: false
    cave-golem: false
    crying-bat: false
    dead-miner: false
    hexed-armor: false
    hungering-darkness: false
    lava-creeper: false
    magma-monster: false
    mimic: false
    smoke-demon: false
    tnt-creeper: false
    watcher: false

mobs:
  enabled: true

  # Chance of spawning custom mob instead of vanilla one
  try-chance: 25

  # World where mob can spawn(and work as it's intended to work)
  worlds:
    - world

  # Minimal and maximal Y coordinate where custom mobs can spawn.
  # (Since 1.18 caves go down to Y -64, so y-min is -64 by default.)
  y-min: -64
  y-max: 64

  # Block renaming with name-tags
  restrict-rename: false

  # Maximal light level where mobs can spawn. Vanilla level for monsters is 7. Set to 16 or more to disable
  max-light-level: 16

  # Only these mobs will be replaced
  replace-mobs:
    - ZOMBIE
    - HUSK
    - SKELETON
    - STRAY
    - CREEPER
    - SPIDER
    - WITCH
    - ENDERMAN

  # List of *default* custom mobs

  # enabled controla si el encuentro participa en spawns naturales.
  # priority controla su peso relativo entre los encuentros habilitados.
  # Un mob deshabilitado no participa aunque conserve una prioridad mayor que 0.
  # show-name controla si su nombre configurado se muestra sobre la entidad.

  # Alpha Spider
  # Spawns cave-spiders as minions and covers player in cobweb
  alpha-spider:
    enabled: false
    priority: 0
    health: 18
    name: "&4Alpha Spider"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    # When spider is damaged
    cobweb-chance: 14.29
    # When spider is damaged
    minion-chance: 6.67

  # Crying Bat
  # Just screams and eventually dies. What a legend
  crying-bat:
    enabled: false
    priority: 0
    name: "&4Crying Bat"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    # Every ENTITY tick
    cry-chance: 3.33
    # Every ENTITY tick if cry was successful
    death-chance: 20

  # Dead Miner
  # Places torches when it's too dark and drops some items when damaged
  dead-miner:
    enabled: false
    priority: 0
    name: "&4Dead Miner"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 22
    # Get your custom head here https://minecraft-heads.com/
    # Just copy a "Value" (with =)
    head-value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzE5MzdiY2Q1YmVlYWEzNDI0NDkxM2YyNzc1MDVlMjlkMmU2ZmIzNWYyZTIzY2E0YWZhMmI2NzY4ZTM5OGQ3MyJ9fX0="
    # Place torches when it's too dark?
    place-torches: true
    # Place redstone torches instead of normal?
    red-torches: false
    # Place torches only if Dead Miner has entity as a target?
    requires-target: false
    # Cooldown in seconds between torches placing. Useful for preventing torch farms. Set to 0 to disable
    torches-cooldown: 12
    # When Dead Miner is damaged
    drop-chance: 30
    # Materials list
    drop-items:
      - COBBLESTONE
      - DIRT
      - COAL
      - TORCH

  # Hexed Armor
  # When attacks gives player all its armor
  hexed-armor:
    enabled: false
    priority: 0
    name: "&4Hexed Armor"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # Add binding curse to armor
    binding-curse: true
    # When player is attacked
    apply-chance: 25

  # Hungering Darkness
  # Spawns in the dark and kills player if there's no light
  hungering-darkness:
    enabled: false
    priority: 0
    name: ""
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    # Kill the entity on light?
    remove-on-light: false
    # Play death sound on light?
    death-sound: true
    # Is night vision effect considered as light?
    night-vision: false
    # When player is attacked
    damage: 200

  # Lava Creeper
  # When blows up creates a crater with magma, obsidian and lava
  lava-creeper:
    enabled: false
    priority: 0
    name: "&4Lava Creeper"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # When Lava Creeper is damaged. In ticks
    fire-touch: 10
    # Radius in blocks
    radius: 4
    # Chance that the block will be changed
    change-chance: 50
    block-chances:
      fire: 33.33
      magma_block: 25
      obsidian: 20
      lava: 16.67

  # Magma Monster
  # Leaves a trail of magma on its way
  magma-monster:
    enabled: false
    priority: 0
    name: "&4Magma Monster"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # If monster is extinguished it will receive damage
    extinguished-damage: false
    # Placing fire. Every ENTITY tick
    fire-chance: 7.14
    # Placing magma-blocks. Every ENTITY tick
    magma-chance: 3.57
    # Place magma and fire only if Magma Monster has entity as a target?
    requires-target: true

  # Smoke Demon
  # Creates a smoke and gives wither effect
  smoke-demon:
    enabled: false
    priority: 0
    name: ""
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # Radius in blocks
    harm-radius: 3
    # Condition for spawning and harm/wither effect
    max-light: 11

  # TNT Creeper
  # Spawns additional TNTs when explodes and creates small explosion when damaged
  tnt-creeper:
    enabled: false
    priority: 0
    name: "&4TNT Creeper"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # Amount of TNT to spawn after explosion
    tnt-amount: 2
    # When TNT Creeper is damaged
    explosion-chance: 33.33

  # Watcher
  # Just jumpscares a player
  watcher:
    enabled: false
    priority: 0
    name: "&4Watcher"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 20
    # Get your custom head here https://minecraft-heads.com/
    # Just copy a "Value" (with =)
    head-value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDI5MzhmMjQxZDc0NDMzZjcyZjVjMzljYjgzYThlNWZmN2UxNzdiYTdjYjQyODY5ZGI2NGUzMDc5MTAyYmZjNSJ9fX0="

  # Mimic
  # Becomes a chest when it has no target
  mimic:
    enabled: false
    priority: 0
    # Limita tanto Mimics vivos como cofres activos para evitar acumulacion.
    max-active: 1
    name: "&4Mimic"
    show-name: false
    # Drops adicionales de CavesLite al morir. No reemplaza los drops vanilla ni la mecanica propia del mob.
    extra-drops: []
    death-command:
      enabled: false
      command: ""
    health: 30
    # No crea un cofre Mimic si ya existe cualquier cofre dentro de este radio.
    min-distance-from-chest: 16
    # Máximo de cofres Mimic activos simultáneamente por mundo.
    max-active-chests: 1
    # Un cofre Mimic sin descubrir desaparece después de este tiempo. 0 = sin límite.
    lifetime-seconds: 900
    # Recomendado: elimina el cofre Mimic antes de que su chunk se descargue.
    remove-on-unload: true
    # List of dropped materials after death
