# Herobrine: encuentro de terror psicológico. No es un boss tradicional - la
# mayoría de las veces no pasa nada más que verlo brevemente u oír algo raro.
# Solo entra en combate si un jugador lo ataca primero. Ver DOCUMENTATION.md
# para el detalle completo de cómo funciona cada mecánica.
herobrine:
  enabled: false
  worlds: [world]
  # Vacío = cualquier bioma
  biomes: []
  y-min: -64
  y-max: 320
  # El spawn natural usa un temporizador por jugador, no una tirada de azar cada pocos segundos.
  encounter-interval:
    # Próximo encuentro natural entre 8 y 20 minutos de juego, elegido aleatoriamente.
    min-seconds: 480
    max-seconds: 1200
  # Protección adicional tras un encuentro.
  cooldown-seconds: 120
  min-distance-from-player: 10
  max-distance-from-player: 24
  # Dos instancias no aparecen a menos de esta distancia entre sí
  min-distance-between-instances: 32
  # Qué tipos de encuentro pueden salir (ver DOCUMENTATION.md para la descripción de cada uno)
  encounters:
    observe: true
    flee-on-sight: true
    behind: true
    false-chase: true
    outside-observer: true
    # Comportamiento inspirado en el Creaking: se congela al mirarlo y se acerca al apartar la vista.
    # NO requiere que exista un Creaking cerca.
    watcher: true
    # Encuentros inspirados en el acecho clásico de Herobrine / From The Fog
    lurking: true
    stalking: true
    creeping: true
  observation:
    # Si un jugador lo mira fijo más de esto, desaparece
    max-look-seconds: 8
    # % de probabilidad, cuando nadie lo mira, de reubicarse cerca de otro jugador
    teleport-chance: 20
    # % de probabilidad, cuando nadie lo mira, de desaparecer del todo
    vanish-chance: 10
  # Sistema de acecho. Las distancias siguen la idea de From The Fog, pero la
  # implementación es nativa de Paper/Purpur y no depende del resource/datapack.
  stalking:
    max-lifetime-seconds: 45
    lurking:
      min-distance: 50
      max-distance: 80
      max-lateral: 50
    stalking:
      min-distance: 25
      max-distance: 46
      max-lateral: 35
    creeping:
      min-distance: 3
      max-distance: 5
